[project]
name = "deer-flow"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    # Tests import harness modules directly through pytest's pythonpath, so
    # keep the agent runtime stack visible from the backend root package too.
    "langchain>=1.3.0",
    "langchain-anthropic>=1.3.4",
    "langchain-deepseek>=1.0.1",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.2.0",
    "langgraph-api>=0.8.0",
    # Production config uses the PostgreSQL checkpointer; langgraph-api does
    # not install this backend transitively.
    "langgraph-checkpoint-postgres>=3.0.3",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-cli>=0.4.14",
    "langgraph-runtime-inmem>=0.22.1",
    "langgraph-sdk>=0.1.51",
    "deepagents>=0.6.0,<0.7.0",
    "markdown-to-mrkdwn>=0.3.1",
    # MEM00 pins the exact deployed provider contract. Do not widen this
    # without a separately reviewed provider-modernization amendment.
    "mem0ai==1.0.9",
    # Builder document-generation runtime.
    # These libraries are imported by skill scripts the builder executes
    # (ppt-generation, data-analysis, image-generation) and by any PDF/DOCX
    # deliverable the model decides to produce. Pre-installing them keeps the
    # builder from burning its turn budget on `pip install` inside the sandbox,
    # which in Render routinely trips the 12-turn hard ceiling or the
    # Anthropic HTTP read timeout.
    "pillow>=10.4.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "playwright>=1.56.0,<2.0.0",
    "pypdf>=5.1.0",
    "reportlab>=4.2.5",
    "cairosvg>=2.7.1",
    "svglib>=1.5.1,<1.6",
    "fpdf2>=2.8.1",
    "markdown>=3.7",
    "duckdb>=1.1.3",
    "requests>=2.32.3",
    # Locked production database migrations use the PostgreSQL v3 driver.
    "psycopg[binary]>=3.2.0,<4.0.0",
    # Visualization runtime — matplotlib/seaborn charts embedded in PDFs,
    # numpy/pandas for any data wrangling the builder needs before rendering.
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/harness"]
