# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Isolated VT00 production test services. This service-only Blueprint is
# intentionally separate from render.yaml and from the database-only
# render.voice-lab.database.yaml Blueprint. The referenced database must exist
# before this Blueprint is synced. Both services remain kill-switched until the
# runbook preflight passes.

