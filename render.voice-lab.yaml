services:
  - type: web
    name: sophia-voice-lab-mcp
    runtime: docker
    branch: codex/sophia-observability-v1
    dockerfilePath: ./tools/sophia-voice-lab/Dockerfile
    dockerContext: .
    dockerCommand: pnpm start:web
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sophia-voice-lab-postgres
          property: connectionString
      - fromGroup: sophia-voice-lab-runtime-v1
      # Render does not support `sync: false` inside environment groups. Keep
      # every dashboard-managed identity and secret directly on each owning
      # service so the first Blueprint sync prompts for the exact values.
      # Campaign identities/public verification material must match the worker.
      - key: SOPHIA_VOICE_LAB_REPOSITORY_CANDIDATE_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_PLUGIN_PACKAGE_SHA256
        sync: false
      - key: SOPHIA_VOICE_LAB_PLUGIN_VERSION
        sync: false
      - key: SOPHIA_VOICE_LAB_REGISTERED_APP_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_FRONTEND_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_BACKEND_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_LANGGRAPH_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_VOICE_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_ATTESTATION_PUBLIC_KEYS_JSON
        sync: false
      - key: SOPHIA_VOICE_LAB_BEARER_TOKEN
        sync: false
      - key: SOPHIA_VOICE_LAB_FAULT_BEARER_TOKEN
        sync: false
      - key: SOPHIA_VOICE_LAB_PRINCIPAL_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_CAPABILITY_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_GRANT_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_RECOVERY_INTERNAL_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_CALLER_PARTITION_KEYS_JSON
        sync: false
      - key: SOPHIA_VOICE_LAB_OAUTH_CONSENT_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_OAUTH_TOKEN_PEPPER
        sync: false
      # Admission is service-specific so the operator can close the web gate
      # before draining the worker. It is never opened through the shared group.
      - key: SOPHIA_VOICE_LAB_KILL_SWITCH
        sync: false
      # Bootstrap-only principal creation gate. Set true only while the web
      # kill switch is engaged; set false immediately after the audited call.
      - key: SOPHIA_VOICE_LAB_PROVISIONING_ENABLED
        sync: false
      - key: SOPHIA_VOICE_LAB_PROVISION_OPERATOR_BEARER_TOKEN
        sync: false
      # Web-only transport credentials authenticate independently operated
      # A03, D02, and P01 evidence submitters. Their Ed25519 private keys stay
      # offline; the evaluator worker must receive neither transport tokens
      # nor private signing material.
      - key: SOPHIA_VOICE_LAB_ATTESTATION_TRANSPORT_TOKENS_JSON
        sync: false
      # Product-owned, key-separated authority for the Gateway D02 freeze and
      # settlement endpoints. The browser worker and external controller must
      # never receive this credential.
      - key: SOPHIA_VOICE_LAB_D02_GATEWAY_CAPABILITY_SECRET
        sync: false
      # Gateway receipt verification is public material but remains web-only
      # because the evaluator must consume the product-authenticated event,
      # never validate or ingest a Gateway receipt directly.
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_ED25519_PUBLIC_KEY_SPKI_BASE64
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_AUTHORITY_KEY_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_ED25519_PUBLIC_KEYRING_JSON
        sync: false

  - type: worker
    name: sophia-voice-lab-worker
    runtime: docker
    branch: codex/sophia-observability-v1
    dockerfilePath: ./tools/sophia-voice-lab/Dockerfile
    dockerContext: .
    dockerCommand: pnpm start:worker
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    # The worker can spend 20s resolving an in-flight D02 freeze/dispatch and
    # then up to 25s in its concurrent quiescence/loop-drain boundary. Keep
    # Render's hard SIGKILL deadline beyond that bounded convergence path.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sophia-voice-lab-postgres
          property: connectionString
      - fromGroup: sophia-voice-lab-runtime-v1
      # These values are immutable campaign identities, public verification
      # material, or shared worker authorities. They are dashboard-managed and
      # must match the web service exactly. The post-registration plugin version
      # includes the helper-exact `+codex.<sanitized-lowercase-token>` metadata.
      - key: SOPHIA_VOICE_LAB_REPOSITORY_CANDIDATE_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_PLUGIN_PACKAGE_SHA256
        sync: false
      - key: SOPHIA_VOICE_LAB_PLUGIN_VERSION
        sync: false
      - key: SOPHIA_VOICE_LAB_REGISTERED_APP_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_FRONTEND_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_BACKEND_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_LANGGRAPH_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_EXPECTED_VOICE_SHA
        sync: false
      - key: SOPHIA_VOICE_LAB_ATTESTATION_PUBLIC_KEYS_JSON
        sync: false
      - key: SOPHIA_VOICE_LAB_BEARER_TOKEN
        sync: false
      - key: SOPHIA_VOICE_LAB_FAULT_BEARER_TOKEN
        sync: false
      - key: SOPHIA_VOICE_LAB_PRINCIPAL_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_CAPABILITY_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_GRANT_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_RECOVERY_INTERNAL_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_CALLER_PARTITION_KEYS_JSON
        sync: false
      - key: SOPHIA_VOICE_LAB_OAUTH_CONSENT_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_OAUTH_TOKEN_PEPPER
        sync: false
      # Execution is independently service-scoped. Open it before web admission
      # and close it only after web admission has been stopped and drained.
      - key: SOPHIA_VOICE_LAB_KILL_SWITCH
        sync: false
