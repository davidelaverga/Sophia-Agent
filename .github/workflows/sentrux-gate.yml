name: Architecture gate (sentrux)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: sentrux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      # Pinned sentrux release. Bump after verifying the new version locally.
      # https://github.com/sentrux/sentrux/releases
      SENTRUX_VERSION: v0.5.7
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sentrux (pinned)
        run: |
          set -euo pipefail
          # Sentrux ships raw binaries (not tarballs) per release asset.
          URL="https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64"
          echo "Downloading ${URL}"
          sudo curl -fsSL "${URL}" -o /usr/local/bin/sentrux
          sudo chmod +x /usr/local/bin/sentrux
          sentrux --version

      - name: Capture main baseline
        run: |
          set -euo pipefail
          git worktree add ../main-baseline origin/main
          (cd ../main-baseline && sentrux gate --save .)
          mkdir -p .sentrux
          # Sentrux writes the baseline to .sentrux/baseline.json.
          cp ../main-baseline/.sentrux/baseline.json .sentrux/baseline.json

      - name: Score-regression gate (BLOCKING)
        # If sentrux gate does not exit non-zero on regression, replace this with
        # a parser step that reads the JSON output and exits 1 ourselves.
        run: sentrux gate .

      - name: Rules check (advisory in v1)
        continue-on-error: true
        run: sentrux check .

      - name: Comment score delta on PR (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "**Sentrux architecture gate**"
            echo
            echo '```'
            sentrux gate . --json 2>/dev/null || sentrux gate . || echo 'Score regressed vs `main` — see job logs for details.'
            echo '```'
          } > /tmp/sentrux-comment.md
          python - <<'PY'
          import json
          from pathlib import Path

          body = Path("/tmp/sentrux-comment.md").read_text(encoding="utf-8")[:3800]
          Path("/tmp/sentrux-comment.json").write_text(
              json.dumps({"body": body}),
              encoding="utf-8",
          )
          PY
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data @/tmp/sentrux-comment.json \
            || echo "Could not post sentrux PR comment."
