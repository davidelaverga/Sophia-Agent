name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 15 was never enough for this branch's suite; it was simply never reached,
    # because `make lint` failed first and the job died at ~29s. With the lint
    # errors fixed (#146) `make test` finally runs, and on PR #146 it was killed
    # by this timeout at roughly 38% of the suite after ~14.5 minutes of test
    # time -- extrapolating to ~38 minutes for the 6,227 tests on this line, and
    # more for the MEM00 integration line's 7,256.
    #
    # Raised rather than worked around. Two cheaper follow-ups are deliberately
    # NOT bundled here: `make test` passes `-v`, which writes one log line per
    # test (6,000+ lines) and is likely a large part of the gap between CI and
    # a local run of the same suite; and pytest-xdist (`-n auto`) is not a
    # dependency yet. Both touch the shared Makefile, so they are their own
    # decisions.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      # pandoc enables the PDF-template parse tests (prod 2026-06-11: a
      # template parse error shipped because the only full-parse check was
      # container-gated and never ran). ubuntu-latest apt pandoc is close
      # to the container's Debian pandoc; the exact-version smoke lives in
      # the docker target.
      - name: Install pandoc (template parse tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

      - name: Run unit tests of backend
        working-directory: backend
        run: make test
