name: Visual quality evals (G-VIS matrix)

# Real API spend: nightly + manual dispatch only (Spec VQ-9; cadence decided
# 2026-06-11). PRs run the free deterministic gates (goldens) in unit tests.
on:
  schedule:
    - cron: "17 6 * * *"  # nightly 06:17 UTC
  workflow_dispatch:

concurrency:
  group: visual-evals
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOPHIA_BUILDER_OPENAI_FALLBACK_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv + deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev

      - name: Install render deps (pandoc/xelatex/poppler/libreoffice)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern fonts-dejavu-core fonts-liberation \
            poppler-utils libreoffice-impress

      - name: Boot langgraph (anthropic provider)
        working-directory: backend
        run: |
          nohup uv run langgraph dev --host 127.0.0.1 --port 2024 --no-browser \
            --allow-blocking --no-reload --n-jobs-per-worker 4 > /tmp/lg.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:2024/ok && break || sleep 2
          done

      - name: Matrix — anthropic
        working-directory: backend
        run: SOPHIA_EVAL_LANGGRAPH_URL=http://127.0.0.1:2024 PYTHONPATH=. uv run python tests/evals/visuals/run_matrix.py --provider anthropic

      - name: Reboot langgraph (forced openai provider)
        working-directory: backend
        run: |
          pkill -f "langgraph dev" || true
          sleep 3
          SOPHIA_BUILDER_FORCE_PROVIDER=openai nohup uv run langgraph dev --host 127.0.0.1 \
            --port 2024 --no-browser --allow-blocking --no-reload --n-jobs-per-worker 4 > /tmp/lg2.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:2024/ok && break || sleep 2
          done

      - name: Matrix — openai (forced)
        working-directory: backend
        run: SOPHIA_EVAL_LANGGRAPH_URL=http://127.0.0.1:2024 PYTHONPATH=. uv run python tests/evals/visuals/run_matrix.py --provider openai

      - name: Upload langgraph logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langgraph-logs
          path: /tmp/lg*.log
