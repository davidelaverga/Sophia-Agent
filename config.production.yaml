# Sophia MVP — Production Configuration for Render
# Used by Dockerfile.langgraph and Dockerfile.gateway
# API keys resolve from Render environment variables at runtime

config_version: 2

models:
  - name: claude-haiku-4-5-20251001
    display_name: Claude Haiku 4.5
    use: langchain_anthropic:ChatAnthropic
    model: claude-haiku-4-5-20251001
    api_key: $ANTHROPIC_API_KEY
    max_tokens: 4096
    temperature: 1.0

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# Tool groups + native web tools. Without these, Sophia's `load_sophia_web_tools()`
# resolves to an empty list, the WebResearchGuidanceMiddleware is skipped, and
# the companion + builder both lose web access (the user-visible symptom is
# Sophia answering "I don't have access to any web tool"). Required env vars on
# Render: TAVILY_API_KEY for web_search; web_fetch uses Jina's no-key endpoint
# unless a JINA_API_KEY is supplied.
tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.tavily.tools:web_search_tool
    max_results: 5

  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

skills:
  path: ../skills
  container_path: /mnt/skills

subagents:
  enabled: true

memory:
  enabled: false

summarization:
  enabled: true
  trigger:
    type: messages
    value: 10
  keep:
    type: messages
    value: 4

channels:
  # ChannelManager dispatches inbound IM messages to the LangGraph runtime via
  # this URL. On Render the gateway service has LANGGRAPH_URL set in env to the
  # internal hostname of the sophia-langgraph service.
  langgraph_url: $LANGGRAPH_URL
  telegram:
    enabled: true
    bot_token: $TELEGRAM_BOT_TOKEN
    session:
      assistant_id: sophia_companion
      context:
        platform: text
        context_mode: life
    # bot_username (e.g. Sophia_EI_bot) is read from the TELEGRAM_BOT_USERNAME
    # env var by app.gateway.telegram_link_store — no need to pass it here.
    # allowed_users: []  # empty = allow any Telegram user

  # Builder-as-Main Work bot — Stage 1 of the Phase-3 Telegram diagnostic.
  # @Sophia_Work_bot DMs bypass the companion graph and dispatch directly to
  # sophia_builder via runs.wait. The 3-step resolver in TelegramWorkChannel
  # (forward fast-path → reverse lookup by Telegram user_id → auto-bind)
  # automatically recognises any user already bound through @Sophia_EI_bot's
  # deep-link flow — no separate webapp onboarding required for Stage 1C.
  #
  # Required env vars on Render (gateway service):
  #   TELEGRAM_WORKER_BOT_TOKEN     — from BotFather, the @Sophia_Work_bot token.
  #                                    MUST be set on the gateway service.
  #
  # Note on bot_username: hardcoded below rather than env-var-resolved. The
  # langgraph service ALSO loads this file (per Dockerfile.langgraph) and the
  # config resolver raises ValueError on any missing $VAR. Hardcoding the
  # username (which is public, not a secret) keeps the langgraph deploy safe
  # while still being trivially editable here. Mirrors the EI bot pattern,
  # which doesn't put bot_username in YAML at all (it's read separately by
  # app.gateway.telegram_link_store from $TELEGRAM_BOT_USERNAME). If you
  # rename @Sophia_Work_bot in BotFather, edit this line.
  # NOTE (sophia_telegram_architecture_spec_v1.md): the legacy
  # Builder-as-Main DM channel (PR #120) is disabled now that the workshop
  # presentation layer below has taken over the bot. Workshop and
  # telegram_work share $TELEGRAM_WORKER_BOT_TOKEN — exactly one of them
  # must be enabled at a time (WorkshopTelegramChannel.start refuses to
  # boot if both are true). Deletion of the legacy code is deferred to a
  # Phase 3 cleanup PR after 1 week of stable workshop production.
  telegram_work:
    enabled: false
    bot_token: $TELEGRAM_WORKER_BOT_TOKEN
    bot_username: Sophia_Work_bot
    pilot_user_id: ""             # empty = any EI-bound user welcome.
                                  # Set to a single canonical Sophia user_id
                                  # during Stage 1B smoke testing if you want
                                  # to gate the channel to one tester.
    allowed_users: []             # empty = no extra Telegram-user-id allowlist.
                                  # Subject to enabled + pilot_user_id gates.
    run_timeout_seconds: 900      # 15 min — matches Builder hard turn-budget
                                  # ceiling. runs.wait raises asyncio.TimeoutError
                                  # past this and the placeholder is edited with
                                  # the timeout message.

  # Workshop presentation layer — Phase 1 of sophia_telegram_architecture_spec_v1.
  # When enabled, @Sophia_work_bot becomes an event-driven presentation surface
  # for builder runs: companion @-mentions the workshop bot in the user-companion
  # chat, Telegram dispatches a guest update, and the workshop bot opens a
  # streaming reply that renders builder activity until completion (then
  # attaches the artifact as a Telegram document).
  #
  # MUTUAL EXCLUSION: telegram_workshop and telegram_work share the same
  # bot token ($TELEGRAM_WORKER_BOT_TOKEN). They CANNOT both run at the same
  # time. Phase 1 default keeps telegram_workshop disabled. Phase 2 rollout:
  # flip telegram_work.enabled=false AND telegram_workshop.enabled=true in
  # the same deploy.
  #
  # Bot-username is hardcoded for the same reason as telegram_work — public
  # value, baked into the langgraph deploy.
  # Phase 3 (sophia_telegram_architecture_spec_v1, 2026-05-15): the
  # workshop bot's polling thread is intentionally dormant. The
  # companion bot (@Sophia_EI_bot) owns the streaming-progress UX via
  # a placeholder it edits live (CompanionProgressReceiver) — no
  # bot-to-bot chat tagging, no @-mention pollution. The workshop bot
  # code paths stay in the repo as dormant infrastructure pending a
  # future spec (e.g. builder-asks-user-a-question). BotFather Guest
  # Mode + Bot-to-Bot Communication stay enabled on the bot — harmless.
  telegram_workshop:
    enabled: false
    bot_token: $TELEGRAM_WORKER_BOT_TOKEN
    bot_username: Sophia_work_bot
    cold_dm_mute_minutes: 30
