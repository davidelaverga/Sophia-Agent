# Sophia MVP — Production Configuration for Render
# Used by Dockerfile.langgraph and Dockerfile.gateway
# API keys resolve from Render environment variables at runtime

config_version: 4

models:
  - name: claude-haiku-4-5-20251001
    display_name: Claude Haiku 4.5
    use: langchain_anthropic:ChatAnthropic
    model: claude-haiku-4-5-20251001
    api_key: $ANTHROPIC_API_KEY
    max_tokens: 4096
    temperature: 1.0

  # DQ canary only. This deployment is never selected by the companion or
  # builder; it is reachable solely through locked judge/repair routes.
  # The DQ invoker injects SOPHIA_DECK_QUALITY_OPENAI_API_KEY only after exact
  # canary admission. Ordinary builder/companion/image/fallback paths retain
  # their pre-campaign configuration and cannot select this DQ-only authority.
  - name: openai-gpt-5-6-sol
    display_name: OpenAI GPT-5.6 Sol (DQ-1 shadow judge)
    access_scope: route_only
    use: langchain_openai:ChatOpenAI
    provider: openai
    model: gpt-5.6-sol
    supports_vision: true
    supports_reasoning_effort: true
    capabilities:
      - image_input
      - multi_image_input
      - strict_structured_output
      - reasoning_effort

model_routes:
  deck.judge.visual:
    primary: openai-gpt-5-6-sol
    fallbacks: []
    profile: deck-visual-judge-v2
    required_capabilities:
      - image_input
      - multi_image_input
      - strict_structured_output
      - reasoning_effort
    max_failovers: 0

  deck.repair.executor:
    primary: openai-gpt-5-6-sol
    fallbacks: []
    profile: deck-repair-executor-v1
    required_capabilities:
      - image_input
      - multi_image_input
      - strict_structured_output
      - reasoning_effort
    max_failovers: 0

harness_profiles:
  deck-visual-judge-v2:
    version: v2
    timeout_seconds: 180
    max_retries: 0
    model_overrides:
      reasoning:
        effort: high
        mode: standard
        context: current_turn
      output_version: responses/v1
      use_responses_api: true
      # Each deck assessment is a fresh, stateless provider request. This
      # prevents response/reasoning reuse across artifacts and minimizes
      # provider-side retention of the synthetic canary evidence.
      store: false
      max_completion_tokens: 6000

  deck-repair-executor-v1:
    version: v1
    timeout_seconds: 360
    max_retries: 0
    model_overrides:
      reasoning:
        effort: high
        mode: standard
        context: current_turn
      output_version: responses/v1
      use_responses_api: true
      store: false
      max_completion_tokens: 24000

# DQ-2 may mutate only through the enforced manifest/CAS foundation and its
# durable transaction RPCs. These values are validated again during LangGraph
# startup before the service becomes ready.
build_foundation:
  enabled: true
  manifest_mode: canary_enforce
  enforce_canary_user_ids: $SOPHIA_DECK_QUALITY_CANARY_USER_IDS
  enable_mutation_transactions: true

# Amendment 002 reopens DQ-1 with a durable pre-delivery outbox. Admission is
# still exact-canary only; all user-visible and repair authorities remain
# locked off. The environment value is dashboard-managed on both services.
deck_quality:
  enabled: true
  mode: "shadow"
  scope: canary
  canary_user_ids: $SOPHIA_DECK_QUALITY_CANARY_USER_IDS
  judge_route: deck.judge.visual
  rubric_version: deck-rubric-v2
  judge_profile_version: deck-visual-judge-v2
  evidence_preprocessor_version: deck-evidence-v5
  judge_invoker_version: deck-judge-invoker-v4
  # Explicit operator authorization for this internal canary campaign. The
  # existing OpenAI credential is copied into the DQ-only environment name;
  # all route, exact-canary, privacy, and call-budget locks remain enforced.
  allow_shared_provider_credential: true
  async_after_success: true
  mutate_artifact: false
  affect_delivery: false
  sample_rate: 0.0
  max_quality_calls: 2
  max_quality_cost_usd: 0.60
  max_quality_wall_clock_seconds: 300

# DQ-2 is a separate, exact-canary authority. Startup remains fail-closed until
# its durable mutation schema, storage probes, and locked routes all validate.
deck_design_lift:
  enabled: true
  mode: "production_canary"
  scope: canary
  canary_user_ids: $SOPHIA_DECK_QUALITY_CANARY_USER_IDS
  judge_route: deck.judge.visual
  repair_route: deck.repair.executor
  judge_profile_version: deck-visual-judge-v2
  repair_profile_version: deck-repair-executor-v1
  max_repairs: 1
  affect_delivery: false
  promote_improved_candidate: true
  max_judge_calls: 4
  max_repair_calls: 1
  max_campaign_cost_usd: 3.00
  max_campaign_wall_clock_seconds: 900
  require_manifest_enforce: true
  require_mutation_transactions: true
  require_mechanical_pass_before_commit: true
  require_second_judge_approval: true
  require_deterministic_improvement: true

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# Tool groups + native web tools. Without these, Sophia's `load_sophia_web_tools()`
# resolves to an empty list, the WebResearchGuidanceMiddleware is skipped, and
# the companion + builder both lose web access (the user-visible symptom is
# Sophia answering "I don't have access to any web tool"). Required env vars on
# Render: TAVILY_API_KEY for web_search; web_fetch uses Jina's no-key endpoint
# unless a JINA_API_KEY is supplied.
tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.tavily.tools:web_search_tool
    max_results: 5

  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

skills:
  path: ../skills
  container_path: /mnt/skills

subagents:
  enabled: true

memory:
  enabled: false

summarization:
  enabled: true
  trigger:
    type: messages
    value: 10
  keep:
    type: messages
    value: 4

channels:
  # ChannelManager dispatches inbound IM messages to the LangGraph runtime via
  # this URL. On Render the gateway service has LANGGRAPH_URL set in env to the
  # internal hostname of the sophia-langgraph service.
  langgraph_url: $LANGGRAPH_URL
  telegram:
    enabled: true
    bot_token: $TELEGRAM_BOT_TOKEN
    session:
      assistant_id: sophia_companion
      context:
        platform: text
        context_mode: life
    # bot_username (e.g. Sophia_EI_bot) is read from the TELEGRAM_BOT_USERNAME
    # env var by app.gateway.telegram_link_store — no need to pass it here.
    # allowed_users: []  # empty = allow any Telegram user

  # NOTE: the legacy ``telegram_work`` Builder-as-Main DM channel
  # (@Sophia_Work_bot direct DMs to the builder graph) was deleted in
  # Phase 4C of the v3 streaming migration. Builds now route through
  # the companion only. @Sophia_Work_bot can be deactivated in
  # BotFather and TELEGRAM_WORKER_BOT_TOKEN can be removed from
  # Render's gateway service after this deploy.
