# Sophia MVP — Render Blueprint
# Sync this Blueprint manually only at an ordered, attested release boundary.
# Git auto-deploy and Blueprint Auto Sync stay disabled for the VT00 rollout.
# Set env vars in Render Dashboard → Environment tab (or use env groups).

services:
  # ─────────────────────────────────────────────────────────────────
  # 1. LangGraph Backend (sophia_companion agent)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-langgraph
    runtime: docker
    # Keep the observability promotion reproducible when the Blueprint is synced.
    branch: codex/sophia-observability-v1
    dockerfilePath: ./backend/Dockerfile.langgraph
    dockerContext: .
    autoDeployTrigger: "off"
    plan: standard
    region: oregon
    healthCheckPath: /ok
    # NOTE on worker concurrency: do NOT add `N_JOBS_PER_WORKER` here. The
    # `langgraph dev` CLI explicitly OVERRIDES the env var (see
    # `langgraph_api/cli.py:262-263, 286` — "Don't overwrite"). Concurrency is
    # set via the `--n-jobs-per-worker 10` flag in
    # `backend/Dockerfile.langgraph` CMD instead. Phase 2A (2026-05-20) raised
    # this from the CLI default of 1 to 10 to unblock concurrent builder +
    # companion runs.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required by builder visual skills. The image-generation skill and
      # ppt-generation workflow execute inside sophia-langgraph, not gateway.
      - key: OPENAI_API_KEY
        sync: false
      # DQ-1-only provider authority. The quality invoker injects this key
      # explicitly for the exact admitted canary judge route; ordinary runtime
      # model selection never reads it.
      - key: SOPHIA_DECK_QUALITY_OPENAI_API_KEY
        sync: false
      # DQ-1 accepts only the dedicated synthetic production identity. The
      # value is intentionally dashboard-managed and shared with the gateway
      # for duplicate scope checks; it contains no ordinary-user IDs.
      - key: SOPHIA_DECK_QUALITY_CANARY_USER_IDS
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: SOPHIA_SESSION_STORE
        value: supabase
      - key: SOPHIA_ARTIFACT_REGISTRY_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOPHIA_EXPECTED_SUPABASE_PROJECT_REF
        value: vlxnwmyvhchwbousrdzc
      # Builder durably uploads artifacts to Supabase in production; the gateway
      # artifact registry reads from the SAME bucket. Pin both (non-secret
      # public values) so the two services agree instead of each silently
      # falling back to DEFAULT_BUCKET (Codex P1 PR #131).
      - key: SUPABASE_BUILDER_BUCKET
        value: sophia-builder-artifacts
      - key: SOPHIA_GATEWAY_URL
        sync: false
      # Shared with sophia-gateway. Authenticates exact-byte Builder progress,
      # completion, cleanup, DQ failure, and content-free fallback delivery
      # before any receiver-side mutation.
      - key: SOPHIA_BUILDER_EVENTS_HMAC_SECRET
        sync: false
      # Exact same product/auth PostgreSQL target used by the Gateway retention
      # reaper. Synthetic Builder admission takes the shared cleanup-obligation
      # advisory barrier here before allocating a LangGraph task; ordinary
      # Builder execution never reads this value.
      - key: SOPHIA_VOICE_LAB_AUTH_DATABASE_URL
        sync: false
      # Exact dedicated synthetic identity. Offline/Builder pipelines use this
      # value to exclude the campaign principal from ordinary memory, learning,
      # analytics, and background-work paths before allocating those clients.
      - key: SOPHIA_VOICE_LAB_TEST_PRINCIPAL
        sync: false
      # Keep global LangSmith autotracing off; ordinary Sophia Builder tracing
      # is attached explicitly via graph callbacks below. Protected synthetic
      # runs disable inherited/explicit tracing before client or subprocess
      # allocation and emit a typed supplemental-unavailable projection.
      # Secrets are set in the Render dashboard; non-secret routing values live
      # in the blueprint.
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_ENDPOINT
        value: https://eu.api.smith.langchain.com
      - key: SOPHIA_BUILDER_LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: Sophia
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGGRAPH_POSTGRES_DSN
        sync: false
      # Preserve the pre-DQ-1 builder provider resilience behavior exactly.
      # DQ-1 does not select, migrate, or otherwise alter this path.
      - key: SOPHIA_BUILDER_OPENAI_FALLBACK_ENABLED
        value: "true"
      - key: SOPHIA_BUILDER_OPENAI_FALLBACK_MODEL
        value: gpt-4.1
      - key: SOPHIA_BUILDER_OPENAI_FALLBACK_TIMEOUT_SECONDS
        value: "120"
      - key: SOPHIA_BUILDER_OPENAI_FALLBACK_MAX_RETRIES
        value: "1"
      - key: SOPHIA_BUILDER_PRIMARY_COOLDOWN_SECONDS
        value: "300"
      # Fresh PPTX runtime contract. These values are copied into initial
      # graph state and shared with image/native subprocesses.
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_MAX_NON_ARTIFACT_TURNS
        value: "12"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_FORCE_EMIT_REMAINING_TURNS
        value: "2"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_SOFT_WARN_AT_TURN
        value: "6"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_MAX_WALL_CLOCK_SECONDS
        value: "1200"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_PREPARE_FORCE_AT_TURN
        value: "2"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_PREPARE_FORCE_AFTER_SECONDS
        value: "15"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_AUTHORING_DEADLINE_SECONDS
        value: "720"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_PREFLIGHT_TIMEOUT_SECONDS
        value: "15"
      - key: SOPHIA_BUILDER_PRESENTATION_AUTHORING_TIMEOUT_SECONDS
        value: "360"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_AUTHORING_MAX_TOKENS
        value: "16384"
      - key: SOPHIA_BUILDER_PRESENTATION_BUDGET_TERMINAL_RESERVE_SECONDS
        value: "30"
      # Uncomment only if the write key spans multiple LangSmith workspaces.
      # - key: LANGSMITH_WORKSPACE_ID
      #   sync: false
      # Optional read/export shortcut for code-agent trace fetchers.
      # - key: LANGSMITH_PROJECT_UUID
      #   sync: false

  # ─────────────────────────────────────────────────────────────────
  # 2. Gateway API (REST + SSE proxy)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-gateway
    runtime: docker
    branch: codex/sophia-observability-v1
    dockerfilePath: ./backend/Dockerfile.gateway
    dockerContext: .
    autoDeployTrigger: "off"
    plan: starter
    region: oregon
    healthCheckPath: /ready
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: SOPHIA_SESSION_STORE
        value: supabase
      - key: SOPHIA_ARTIFACT_REGISTRY_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOPHIA_EXPECTED_SUPABASE_PROJECT_REF
        value: vlxnwmyvhchwbousrdzc
      # Artifact registry runs in supabase mode in production. `ArtifactRegistry()`
      # is built at gateway router import and FAIL-FASTS in a production runtime
      # unless this is set; the supabase store also requires the bucket name.
      # Both are non-secret public values. Codex P1 PR #131: deploying the
      # blueprint without these crashed the gateway before /health could serve.
      - key: SUPABASE_BUILDER_BUCKET
        value: sophia-builder-artifacts
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: LANGGRAPH_URL
        sync: false
      # The gateway loads config.production.yaml for route/runtime validation;
      # keep the production checkpointer DSN available there as well as on the
      # LangGraph service. The value remains dashboard-managed.
      - key: LANGGRAPH_POSTGRES_DSN
        sync: false
      # Gateway performs durable request reconciliation, bounded provenance
      # materialization, and lease dispatch. It never receives the DQ-only
      # OpenAI credential, rendered judge evidence, or model-facing payloads;
      # pre-campaign gateway environment remains otherwise unchanged.
      - key: SOPHIA_DECK_QUALITY_CANARY_USER_IDS
        sync: false
      # Shared with sophia-langgraph. Authenticates exact-byte Builder progress,
      # completion, cleanup, DQ failure, and content-free fallback delivery
      # before any receiver-side mutation.
      - key: SOPHIA_BUILDER_EVENTS_HMAC_SECRET
        sync: false
      - key: SOPHIA_VOICE_SERVER_URL
        sync: false
      # Mandatory service-to-service boundary for every voice session/resource
      # route. Shared only with sophia-voice; production fails closed if absent.
      - key: SOPHIA_VOICE_INTERNAL_AUTH_REQUIRED
        value: "true"
      - key: SOPHIA_VOICE_INTERNAL_AUTH_SECRET
        sync: false
      # Synthetic production dogfood is a separate, exact-principal plane.
      # It remains disabled and kill-switched until an operator opens both gates.
      - key: SOPHIA_VOICE_LAB_ENABLED
        value: "false"
      - key: SOPHIA_VOICE_LAB_KILL_SWITCH
        value: "true"
      - key: SOPHIA_VOICE_LAB_TEST_PRINCIPAL
        sync: false
      - key: SOPHIA_VOICE_LAB_ENVIRONMENT
        value: production
      - key: SOPHIA_VOICE_LAB_MAX_TTL_SECONDS
        value: "300"
      - key: SOPHIA_VOICE_LAB_CAPABILITY_SECRET
        sync: false
      # Owning Voice replicas heartbeat exact provider admissions through the
      # shared Gateway CLOSED fence and acknowledge local close before cleanup.
      - key: SOPHIA_GATEWAY_URL
        sync: false
      # Dedicated only to Voice Lab↔Gateway out-of-band recovery; it must be
      # distinct from grant, capability, Builder, and Gateway↔Voice secrets.
      - key: SOPHIA_VOICE_LAB_RECOVERY_INTERNAL_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_AUTH_TOMBSTONE_ACTIVE_KID
        value: v1
      # Canonical JSON keyring shared with the frontend; previous kids remain
      # configured until the auth-ledger readiness drain permits removal.
      - key: SOPHIA_VOICE_LAB_AUTH_TOMBSTONE_KEYS
        sync: false
      # Gateway revokes only exact-run Better Auth sessions during recovery.
      - key: SOPHIA_VOICE_LAB_AUTH_DATABASE_URL
        sync: false
      # V-D02 hard browser-worker settlement uses a separately provisioned,
      # least-privilege database role. It must never fall back to the frontend
      # Better Auth role or the service_role credential.
      - key: SOPHIA_VOICE_LAB_D02_GATEWAY_DATABASE_URL
        sync: false
      # Distinct database-finalize authority shared only with the owner
      # migration operator; never copy either value to Voice Lab web/worker.
      - key: SOPHIA_VOICE_LAB_D02_DATABASE_FINALIZE_HMAC_KEY_ID
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_DATABASE_FINALIZE_HMAC_SECRET
        sync: false
      # Product-service -> Gateway freeze/settlement capability. This exact
      # secret is also configured on the Voice Lab web service, never its
      # browser worker or the external deployment controller.
      - key: SOPHIA_VOICE_LAB_D02_GATEWAY_CAPABILITY_SECRET
        sync: false
      # Gateway-only receipt authorities. Only the current public key and key
      # ID are copied to Voice Lab web for verification.
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_IDENTITY_HMAC_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_ED25519_PRIVATE_KEY_PKCS8_BASE64
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_ED25519_PUBLIC_KEY_SPKI_BASE64
        sync: false
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_AUTHORITY_KEY_ID
        sync: false
      # Retained public verification keys keep immutable response-loss replay
      # valid across key rotation until every signed receipt is purged.
      - key: SOPHIA_VOICE_LAB_D02_SETTLEMENT_ED25519_PUBLIC_KEYRING_JSON
        sync: false
      # Product-owned hard-retention cleanup is mandatory and independent of
      # the lab enable/kill switches. These values bound each lease-fenced
      # discovery cycle without changing signed per-run retention.
      - key: SOPHIA_VOICE_LAB_RETENTION_REAPER_REQUIRED
        value: "true"
      - key: SOPHIA_VOICE_LAB_RETENTION_REAPER_INTERVAL_SECONDS
        value: "60"
      - key: SOPHIA_VOICE_LAB_RETENTION_REAPER_BATCH_SIZE
        value: "25"
      # Render disks are ephemeral; a synthetic finalization succeeds only
      # after an immutable receipt is written to the configured Supabase bucket.
      - key: SOPHIA_VOICE_LAB_DURABLE_EVIDENCE_REQUIRED
        value: "true"
      # Keep gateway route selection aligned with the voice service. The
      # production promotion flag is the fast rollback switch to legacy voice.
      - key: SOPHIA_VOICE_RUNTIME_MODE
        value: gemini_live
      - key: SOPHIA_VOICE_EXPERIMENTAL_RUNTIME_ENABLED
        value: "true"
      - key: SOPHIA_VOICE_GEMINI_LIVE_ADAPTER_ENABLED
        value: "true"
      - key: SOPHIA_VOICE_GEMINI_PRODUCTION_ROUTE_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Bot username (no '@') used to build webapp -> Telegram deep links.
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # NOTE: TELEGRAM_WORKER_BOT_TOKEN was deleted in Phase 4C of the
      # v3 streaming migration. The Builder-as-Main DM channel
      # (@Sophia_Work_bot direct DMs) is gone; builds route through the
      # companion only. The env var can be removed from the Render
      # dashboard after this deploy lands.

  # ─────────────────────────────────────────────────────────────────
  # 3. Voice Server (Vision Agents — STT + TTS + WebRTC)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-voice
    runtime: docker
    branch: codex/sophia-observability-v1
    dockerfilePath: ./voice/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    plan: standard
    region: oregon
    healthCheckPath: /ready
    envVars:
      # Disable ONNX Runtime's native POSIX telemetry before smart-turn import;
      # this also prevents a native telemetry mutex race during shutdown.
      - key: ORT_DISABLE_TELEMETRY
        value: "1"
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: SOPHIA_VOICE_ID
        sync: false
      # Must match the gateway value. All direct provider-bearing and session
      # resource routes reject missing/mismatched internal auth in production.
      - key: SOPHIA_VOICE_INTERNAL_AUTH_REQUIRED
        value: "true"
      - key: SOPHIA_VOICE_INTERNAL_AUTH_SECRET
        sync: false
      - key: SOPHIA_VOICE_LAB_ENABLED
        value: "false"
      - key: SOPHIA_VOICE_LAB_KILL_SWITCH
        value: "true"
      - key: SOPHIA_VOICE_LAB_TEST_PRINCIPAL
        sync: false
      - key: SOPHIA_VOICE_LAB_ENVIRONMENT
        value: production
      - key: SOPHIA_VOICE_LAB_MAX_TTL_SECONDS
        value: "300"
      - key: SOPHIA_VOICE_LAB_CAPABILITY_SECRET
        sync: false
      # Owning Voice replicas heartbeat exact provider admissions through the
      # shared Gateway CLOSED fence and acknowledge local close before cleanup.
      - key: SOPHIA_GATEWAY_URL
        sync: false
      - key: SOPHIA_BACKEND_MODE
        value: deerflow
      - key: SOPHIA_LANGGRAPH_BASE_URL
        sync: false
      - key: SOPHIA_ASSISTANT_ID
        value: sophia_companion
      - key: SOPHIA_DEEPGRAM_MODEL
        value: flux-general-en
      - key: SOPHIA_PLATFORM
        value: voice
      - key: SOPHIA_CONTEXT_MODE
        value: life
      # Explicit Gemini Live production promotion. Set the route flag to false
      # to roll back the gateway to legacy_cascade without rebuilding the image.
      - key: SOPHIA_VOICE_RUNTIME_MODE
        value: gemini_live
      - key: SOPHIA_VOICE_EXPERIMENTAL_RUNTIME_ENABLED
        value: "true"
      - key: SOPHIA_VOICE_GEMINI_LIVE_ADAPTER_ENABLED
        value: "true"
      - key: SOPHIA_VOICE_GEMINI_PRODUCTION_ROUTE_ENABLED
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      # Ordinary-user Gemini Live traces are manual RunTree traces; protected
      # Voice Lab runs are structurally excluded from LangSmith and report a
      # typed supplemental-unavailable status. The legacy route remains
      # available as the flag-controlled rollback. API key/workspace are dashboard-managed.
      - key: SOPHIA_GEMINI_LIVE_LANGSMITH_TRACING
        value: "true"
      - key: SOPHIA_GEMINI_LIVE_CONTINUITY_ENABLED
        value: "true"
      - key: SOPHIA_GEMINI_LIVE_COMPRESSION_ENABLED
        value: "true"
      # Keep web capabilities independently switchable for the 2x2 voice
      # reliability canary without coupling either control to continuity.
      - key: SOPHIA_GEMINI_LIVE_GOOGLE_SEARCH_ENABLED
        value: "true"
      - key: SOPHIA_GEMINI_LIVE_WEB_FETCH_ENABLED
        value: "true"
      - key: SOPHIA_GEMINI_LIVE_LANGSMITH_PROJECT
        value: Sophia-Gemini-Live-Voice
      - key: SOPHIA_GEMINI_LIVE_TRACE_SCHEMA
        value: sophia_gemini_live_trace_v2
      - key: SOPHIA_GEMINI_LIVE_TRACE_CONTENT_MODE
        value: structural
      - key: SOPHIA_GEMINI_LIVE_AUDIO_CAPTURE_ENABLED
        value: "false"
      - key: SOPHIA_VOICE_OBSERVABILITY_HMAC_SECRET
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_ENDPOINT
        value: https://eu.api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: Sophia
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_WORKSPACE_ID
        sync: false
