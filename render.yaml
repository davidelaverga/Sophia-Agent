# Sophia MVP — Render Blueprint
# Push this file to trigger automatic service creation on Render.
# Set env vars in Render Dashboard → Environment tab (or use env groups).

services:
  # ─────────────────────────────────────────────────────────────────
  # 1. LangGraph Backend (sophia_companion agent)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-langgraph
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.langgraph
    dockerContext: .
    plan: standard
    region: oregon
    healthCheckPath: /ok
    # NOTE on worker concurrency: do NOT add `N_JOBS_PER_WORKER` here. The
    # `langgraph dev` CLI explicitly OVERRIDES the env var (see
    # `langgraph_api/cli.py:262-263, 286` — "Don't overwrite"). Concurrency is
    # set via the `--n-jobs-per-worker 10` flag in
    # `backend/Dockerfile.langgraph` CMD instead. Phase 2A (2026-05-20) raised
    # this from the CLI default of 1 to 10 to unblock concurrent builder +
    # companion runs.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required by builder visual skills. The image-generation skill and
      # ppt-generation workflow execute inside sophia-langgraph, not gateway.
      - key: OPENAI_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: SOPHIA_SESSION_STORE
        value: supabase
      - key: SOPHIA_ARTIFACT_REGISTRY_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Builder durably uploads artifacts to Supabase in production; the gateway
      # artifact registry reads from the SAME bucket. Pin both (non-secret
      # public values) so the two services agree instead of each silently
      # falling back to DEFAULT_BUCKET (Codex P1 PR #131).
      - key: SUPABASE_BUILDER_BUCKET
        value: sophia-builder-artifacts
      - key: SOPHIA_GATEWAY_URL
        sync: false
      # Keep global LangSmith autotracing off; Sophia builder tracing is attached
      # explicitly via graph callbacks below. Secrets are set in the Render
      # dashboard; non-secret routing values live in the blueprint.
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_ENDPOINT
        value: https://eu.api.smith.langchain.com
      - key: SOPHIA_BUILDER_LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: Sophia
      - key: LANGSMITH_API_KEY
        sync: false
      # Uncomment only if the write key spans multiple LangSmith workspaces.
      # - key: LANGSMITH_WORKSPACE_ID
      #   sync: false
      # Optional read/export shortcut for code-agent trace fetchers.
      # - key: LANGSMITH_PROJECT_UUID
      #   sync: false

  # ─────────────────────────────────────────────────────────────────
  # 2. Gateway API (REST + SSE proxy)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-gateway
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.gateway
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: SOPHIA_SESSION_STORE
        value: supabase
      - key: SOPHIA_ARTIFACT_REGISTRY_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Artifact registry runs in supabase mode in production. `ArtifactRegistry()`
      # is built at gateway router import and FAIL-FASTS in a production runtime
      # unless this is set; the supabase store also requires the bucket name.
      # Both are non-secret public values. Codex P1 PR #131: deploying the
      # blueprint without these crashed the gateway before /health could serve.
      - key: SUPABASE_BUILDER_BUCKET
        value: sophia-builder-artifacts
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: LANGGRAPH_URL
        sync: false
      - key: SOPHIA_VOICE_SERVER_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Bot username (no '@') used to build webapp -> Telegram deep links.
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # NOTE: TELEGRAM_WORKER_BOT_TOKEN was deleted in Phase 4C of the
      # v3 streaming migration. The Builder-as-Main DM channel
      # (@Sophia_Work_bot direct DMs) is gone; builds route through the
      # companion only. The env var can be removed from the Render
      # dashboard after this deploy lands.

  # ─────────────────────────────────────────────────────────────────
  # 3. Voice Server (Vision Agents — STT + TTS + WebRTC)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: sophia-voice
    runtime: docker
    dockerfilePath: ./voice/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    envVars:
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: SOPHIA_VOICE_ID
        sync: false
      - key: SOPHIA_BACKEND_MODE
        value: deerflow
      - key: SOPHIA_LANGGRAPH_BASE_URL
        sync: false
      - key: SOPHIA_ASSISTANT_ID
        value: sophia_companion
      - key: SOPHIA_DEEPGRAM_MODEL
        value: flux-general-en
      - key: SOPHIA_PLATFORM
        value: voice
      - key: SOPHIA_CONTEXT_MODE
        value: life
